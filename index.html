<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetheriaMC Szerver Státusz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .status-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #2c2c2c;
        }
        .server-ip {
            font-size: 1.1em;
            color: #bb86fc;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .online { background-color: #03dac6; box-shadow: 0 0 8px #03dac6; }
        .offline { background-color: #cf6679; box-shadow: 0 0 8px #cf6679; }
        .status-text {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .info-box {
            background-color: #2b2b2b;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            font-size: 0.9em;
        }
        .info-box p {
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <div class="status-card">
        <h2>AetheriaMC Státusz</h2>
        <div class="server-ip">aetheriamc.duckdns.org</div>
        
        <div id="status-container">
            <span class="status-indicator offline" id="dot"></span>
            <span class="status-text" id="status-text">Betöltés...</span>
        </div>

        <div class="info-box" id="details" style="display: none;">
            <p><strong>Verzió:</strong> <span id="server-version">-</span></p>
            <p><strong>Játékosok:</strong> <span id="player-count">0/0</span></p>
            <p><strong>Játékoslista:</strong> <span id="player-list">Nincs senki fent</span></p>
        </div>
    </div>

    <script>
        const serverAddress = "aetheriamc.duckdns.org";
        const apiUrl = `https://api.mcsrvstat.us/3/${serverAddress}`;

        async function checkServerStatus() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const dot = document.getElementById("dot");
                const statusText = document.getElementById("status-text");
                const details = document.getElementById("details");
                const serverVersion = document.getElementById("server-version");
                const playerCount = document.getElementById("player-count");
                const playerList = document.getElementById("player-list");

                if (data.online) {
                    dot.className = "status-indicator online";
                    statusText.innerText = "Szerver Online";
                    details.style.display = "block";

                    serverVersion.innerText = data.software || data.version || "Ismeretlen";
                    
                    const onlinePlayers = data.players ? data.players.online : 0;
                    const maxPlayers = data.players ? data.players.max : 0;
                    playerCount.innerText = `${onlinePlayers} / ${maxPlayers}`;

                    if (data.players && data.players.list && data.players.list.length > 0) {
                        playerList.innerText = data.players.list.join(", ");
                    } else {
                        playerList.innerText = "Jelenleg senki sincs fent";
                    }
                } else {
                    dot.className = "status-indicator offline";
                    statusText.innerText = "Szerver Offline";
                    details.style.display = "none";
                }
            } catch (error) {
                console.error("Hiba történt a státusz lekérdezésekor:", error);
                document.getElementById("status-text").innerText = "Hiba a lekérdezésben";
            }
        }

        // Oldal betöltésekor azonnal lekéri, majd 30 másodpercenként frissíti
        checkServerStatus();
        setInterval(checkServerStatus, 30000);
    </script>

</body>
</html>
